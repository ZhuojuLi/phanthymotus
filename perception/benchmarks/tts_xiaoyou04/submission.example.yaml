# Diagnostic trial template. The checked-in default profile selects Xiaoyou 04.
# TTS_PLUGIN is the evaluator's MCP tool name; no SUT env forwarding is required.
env:
  - name: PHANTHYMOTUS_COMMIT_ID
    value: "REPLACE_WITH_VERIFIED_PUSHED_40_CHARACTER_COMMIT"
  - name: PHANTHYMOTUS_REPO
    value: "https://github.com/ZhuojuLi/phanthymotus.git"
  - name: TTS_PLUGIN
    value: "tts_xiaoyou04"
  - name: JP_VERSION
    value: "6"
