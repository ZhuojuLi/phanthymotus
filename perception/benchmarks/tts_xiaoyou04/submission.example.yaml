# Diagnostic trial template. Replace the commit after push and device checks.
env:
  - name: PHANTHYMOTUS_COMMIT_ID
    value: "REPLACE_WITH_VERIFIED_PUSHED_40_CHARACTER_COMMIT"
  - name: PHANTHYMOTUS_REPO
    value: "https://github.com/ZhuojuLi/phanthymotus.git"
  - name: TTS_PLUGIN
    value: "tts_xiaoyou04"
  - name: CONFIG_PATH
    value: "/work/plugins/xiaoyou04/config.yaml"
  - name: XIAOYOU04_FRONTEND_PYTHON
    value: "/opt/xiaoyou04-frontend/bin/python"
  - name: XIAOYOU04_ALLOW_DIAGNOSTIC
    value: "1"
  - name: JP_VERSION
    value: "6"
