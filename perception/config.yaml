mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  obstacle:
    enabled: true
    provider: local    # openai | qwen | local
    url: ""            # API URL (empty = default endpoint)
    key: ""            # API Key
    model: ""          # model name
    mode: model        # model | diagnostic_constant
    backend_factory: plugins.obstacle_distance_core.mix_backends:create_backends
    # Route by decoded image resolution; OBSTACLE_FIXED_SCENE can override it.
    scene_mode: resolution
    resolution_scene_map:
      "640x480": indoor
      "1600x900": vehicle
    fixed_scene: ""
    depth_backend: dav2_indoor_ft_onnx_roi_p1__yolo26n_depth_int8
    segmentation_backend: yolo26n_seg_int8
    device: cuda
    # Indoor: our deployed ft head (leaderboard indoor F1 = 1.00). Downloaded
    # lazily from juicefs into this dir if the image does not bake it.
    indoor_model_dir: /opt/phanthy-motus/models/obstacle
    vehicle_depth_engine: /models/obstacle-distance/zipdepth-int8/yolo26n-depth-int8.engine
    segmentation_engine: /models/obstacle-distance/zipdepth-int8/yolo26n-seg-int8.engine
    decision_threshold_m: 2.0
    fallback_distance_m: 3.0
    soft_timeout_s: 2.5
    min_interval_ms: 0
    indoor:
      # Statistic params are informational for the mix backend — the indoor
      # head computes ROI-P1 (rows 0-300, cols 213-426 @ 640x480) internally
      # to match the deployed plugin's leaderboard-F1=1.00 behaviour.
      roi: [0, 300, 213, 426]
      roi_reference_size: [480, 640]
    vehicle:
      allowed_classes: [person, car, truck, bus, motorcycle, bicycle]
      min_confidence: 0.25
      percentile: 1.0
      min_depth_m: 0.3
      max_depth_m: 80.0
      camera_to_bumper_offset_m: 1.0
      allow_approximate_geometry: true
      # Apply affine calibration after approximate bumper-offset geometry.
      distance_calibration:
        mode: affine
        scale: 1.2
        bias: -2.4
        min_output_m: 0.0
        max_output_m: 80.0
      calibration: {}
